# Shared Nav2 planner/costmap contract for the hardware and Fortress profiles.
# robot_radius is the configured 2WD candidate (0.22 m), not a physical measurement.
planner_server:
  ros__parameters:
    planner_plugins: [GridBased]

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.22
      resolution: 0.05
      always_send_full_costmap: true
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.22
      resolution: 0.05
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
